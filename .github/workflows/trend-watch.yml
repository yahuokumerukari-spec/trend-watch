name: Daily Trend Watch

on:
  schedule:
    # UTCで指定するため 21:00 UTC = 日本時間 翌6:00
    - cron: "0 21 * * *"
  workflow_dispatch: {}

permissions:
  contents: write  # ログファイルをリポジトリに書き戻すために必要

jobs:
  observe:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Pythonをセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: ライブラリをインストール
        run: pip install -r requirements.txt

      - name: 観察日記を生成・送信
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python trend_watch.py

      - name: ログをリポジトリにコミット
        run: |
          git config user.name "trend-watch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "観察日記: $(date -u +'%Y-%m-%d')"
          git push
